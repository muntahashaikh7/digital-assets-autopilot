name: Daily digital-assets autopilot

on:
  schedule:
    - cron: "0 1 * * *"   # 06:00 PKT daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trend research (free sources)
        run: python3 scripts/research.py
      - name: Pick product lane
        run: python3 scripts/picker.py
      - name: Build listing package
        run: python3 scripts/package.py
      - name: Commit daily output
        run: |
          git config user.name "mjs-autopilot"
          git config user.email "mjs-autopilot@users.noreply.github.com"
          git add daily state/state.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Autopilot $(date -u +%F): $(python3 -c "import json;print(json.load(open('daily/product-idea.json'))['lane'])")"
          git push
